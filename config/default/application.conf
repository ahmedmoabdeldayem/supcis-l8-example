# application.conf — base settings shared by all installations
# Customer-specific values override these in config/customers/<name>/

[server]
http_port         = 8080
request_timeout_ms = 30000
max_connections    = 100

[logging]
log_file  = /var/log/supcis-l8/supcis.log
log_level = INFO          ; DEBUG | INFO | WARN | ERROR

[picking]
max_tasks_per_wave     = 100
short_pick_allowed     = true
wave_release_strategy  = batch   ; batch | single_order

[inventory]
reservation_expiry_sec = 3600    ; unreserve if picker never confirms within 1h
