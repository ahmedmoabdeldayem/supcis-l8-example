# logging.conf — log rotation and format settings

[rotation]
max_file_size_mb = 100      ; rotate log file when it reaches this size
keep_files       = 7        ; keep last 7 rotated files before deleting

[format]
# Each log line: [TIMESTAMP] [LEVEL] [MODULE] message
timestamp_format = %Y-%m-%dT%H:%M:%S
include_pid      = true     ; useful when multiple processes write the same file
