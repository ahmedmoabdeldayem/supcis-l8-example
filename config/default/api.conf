# api.conf — REST API server settings

[http]
port             = 8080
bind_address     = 0.0.0.0       ; listen on all interfaces
max_body_size    = 65536         ; max request body in bytes (64 KB)
keepalive        = true

[auth]
api_key_header   = X-API-Key     ; header name clients must send
api_key          = ${API_KEY}    ; injected at runtime from environment

[cors]
allowed_origins  = *             ; restrict in production to known ERP hosts
