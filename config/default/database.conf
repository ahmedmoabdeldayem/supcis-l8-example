# database.conf — Oracle connection defaults
# Passwords are NEVER stored here — use environment variables

[oracle]
tns_alias        = ${DB_TNS}          ; defined in tnsnames.ora on the server
username         = ${DB_USER}
password         = ${DB_PASS}
pool_min         = 2                  ; minimum idle connections to keep open
pool_max         = 10                 ; maximum simultaneous DB connections
connect_timeout  = 5                  ; seconds before connection attempt fails
query_timeout    = 30                 ; seconds before a query is killed
